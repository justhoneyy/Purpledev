      toast(isNew ? 'Team member added.' : 'Changes saved.');
      if (currentRoute() === 'team') renderTeam();
    } catch (err) { btn.classList.remove('busy'); btn.textContent = isNew ? 'Add member' : 'Save changes'; toast(err.message, 'error'); }
  }
  q1('[data-save]').addEventListener('click', save);
  q1('[data-cancel]').addEventListener('click', () => panel.close());
  panel.el.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
  paintColors(); paint();
  q1('#tp-name').focus();
}

/* ==========================================================================
   Pricing: plans and offers (prices are whole Indian rupees; yearly = total for the year)
   ========================================================================== */
const inr = (n) => '₹' + Number(n).toLocaleString('en-IN');
const toNum = (v) => { const n = parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10); return Number.isFinite(n) && n > 0 ? n : null; };
const numStr = (v) => (v == null ? '' : String(v));

// same rules the public site uses, so the preview matches what visitors will see
function priceView(p, wantYearly) {
  const m = p.price_monthly, y = p.price_yearly;
  const v = { amount: null, unit: '', old: null, note: '', label: '' };
  if (m == null && y == null) { v.label = p.price_label || 'Custom'; return v; }
  const useYearly = wantYearly ? y != null : m == null;
  if (useYearly) {
    v.amount = y; v.unit = '/year'; v.old = p.old_price_yearly;
    if (wantYearly) {
      v.note = `≈ ${inr(Math.round(y / 12))}/month, billed yearly`;
      if (m != null && m * 12 > y) v.note += ` · save ${inr(m * 12 - y)}`;
    } else v.note = 'Yearly billing only';
  } else {
    v.amount = m; v.unit = '/month'; v.old = p.old_price_monthly;
    if (wantYearly) v.note = 'Monthly billing only';
  }
  return v;
}

function planPreviewHtml(p, yearly) {
  const v = priceView(p, yearly);
  const hasPrice = p.price_monthly != null || p.price_yearly != null;
  const badge = p.is_offer ? (p.badge || 'Special offer') : (p.featured ? (p.badge || 'Most popular') : p.badge);
  return `<div class="pvplan ${p.is_offer ? 'offer' : ''} ${!p.is_offer && p.featured ? 'feat' : ''}" style="--c:${esc(p.color)}">
    ${p.is_offer ? '<span class="sheen"></span>' : ''}
    ${badge ? `<span class="pvbadge ${p.is_offer ? 'o' : ''}">✦ ${esc(badge)}</span>` : ''}
    <h4>${esc(p.name || 'Plan name')}</h4>
    <p class="d">${esc(p.description)}</p>
    <div class="pr">${v.amount != null && v.old != null ? `<s>${inr(v.old)}</s>` : ''}<b>${v.amount != null ? inr(v.amount) : esc(v.label)}</b><span>${v.amount != null ? v.unit : ''}</span></div>
    <div class="nt">${esc(v.note)}</div>
    <ul>${p.features.map((f) => `<li>✓ ${esc(f)}</li>`).join('')}</ul>
    <span class="fake-btn">${esc(p.button_text || (hasPrice ? 'Choose ' + (p.name || 'plan') : 'Contact sales'))}</span>
  </div>`;
}

async function viewPricing() {
  if (!state.plans) state.plans = await api('/admin/plans');
  renderPricing();
}

function planCardHtml(p) {
  const hasPrice = p.price_monthly != null || p.price_yearly != null;
  const row = (label, price, old) => `<div class="prow"><small>${label}</small>${price != null
    ? `${old != null ? `<s>${inr(old)}</s>` : ''}<b>${inr(price)}</b><em>${label === 'Monthly' ? 'per month' : 'per year'}</em>`
    : '<em>Not offered</em>'}</div>`;
  return `<article class="pcard ${p.visible ? '' : 'hidden-plan'} ${p.is_offer ? 'is-offer' : ''}" data-id="${p.id}" draggable="true" style="--c:${esc(p.color)}">
    <div class="top">
      <span class="grip" aria-hidden="true">${icon('grip')}</span>
      <div class="movers" style="flex-direction:row"><button type="button" data-act="up" aria-label="Move earlier">${icon('up', 'sm')}</button><button type="button" data-act="down" aria-label="Move later">${icon('down', 'sm')}</button></div>
      <label class="switch" title="Show on your site"><input type="checkbox" data-act="vis" ${p.visible ? 'checked' : ''} aria-label="Show ${esc(p.name)} on your site"><i></i><span>Shown</span></label>
    </div>
    <h3>${esc(p.name)}
      ${p.is_offer ? '<span class="pill warn">✦ Offer</span>' : (p.featured ? '<span class="pill">Highlighted</span>' : '')}
      ${p.visible ? '' : '<span class="pill line">Hidden</span>'}</h3>
    <p class="pdesc">${esc(p.description)}</p>
    <div class="prices">${hasPrice
      ? row('Monthly', p.price_monthly, p.old_price_monthly) + row('Yearly', p.price_yearly, p.old_price_yearly)
      : `<div class="prow"><small>Price</small><b>${esc(p.price_label || 'Custom')}</b></div>`}</div>
    <p class="pfeat">${p.features.length ? `${p.features.length} item${p.features.length === 1 ? '' : 's'} listed: ${esc(p.features.slice(0, 2).join(', '))}${p.features.length > 2 ? '…' : ''}` : 'Nothing listed yet'}</p>
    <div class="acts">
      <button class="btn sm" data-act="edit">${icon('edit', 'sm')}Edit</button>
      <button class="btn sm icon" data-act="delete" aria-label="Delete ${esc(p.name)}" title="Delete">${icon('trash', 'sm')}</button>
    </div>
  </article>`;
}

function renderPricing() {
  const view = $('#view');
  const head = pageHead('Pricing', 'The plans and special offers in the Pricing section of your homepage. Prices are in Indian rupees (₹). Offers shine on your site so visitors notice them.',
    `<button class="btn" data-act="add-offer">${icon('star')}Add offer</button><button class="btn primary cta-glow shine-btn" data-act="add">${icon('plus')}Add plan</button>`);
  if (!state.plans.length) {
    view.innerHTML = head + `<div class="empty"><div class="art">${icon('tag')}</div><h3>No plans yet</h3>
      <p>Until you add one, the Pricing section on your homepage tells visitors to get in touch for a quote.</p>
      <button class="btn primary" data-act="add">${icon('plus')}Add a plan</button></div>`;
  } else {
    view.innerHTML = head + `<div class="pgrid" id="pgrid">${state.plans.map(planCardHtml).join('')}</div>`;
    enableSort($('#pgrid'), { axis: 'x', onDone: persistPlanOrder });
  }
  view.onclick = (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.dataset.act === 'vis') return;
    const card = b.closest('[data-id]');
    const p = card && state.plans.find((x) => String(x.id) === card.dataset.id);
    const act = b.dataset.act;
    if (act === 'add') openPlanEditor();
    else if (act === 'add-offer') openPlanEditor(null, { offer: true });
    else if (act === 'edit' && p) openPlanEditor(p);
    else if (act === 'delete' && p) deletePlan(p);
    else if ((act === 'up' || act === 'down') && card) {
      const sib = act === 'up' ? card.previousElementSibling : card.nextElementSibling;
      if (sib) { card.parentElement.insertBefore(card, act === 'up' ? sib : sib.nextElementSibling); persistPlanOrder($$('[data-id]', card.parentElement).map((c) => c.dataset.id)); }
    }
  };
  view.onchange = async (e) => {
    const sw = e.target.closest('[data-act="vis"]');
    if (!sw) return;
    const p = state.plans.find((x) => String(x.id) === sw.closest('[data-id]').dataset.id);
    try {
      const saved = await api('/admin/plans/' + p.id, { method: 'PUT', body: { ...p, visible: sw.checked } });
      Object.assign(p, saved);
      toast(sw.checked ? `${p.name} is shown on your site.` : `${p.name} is hidden.`);
      renderPricing();
    } catch (err) { sw.checked = !sw.checked; toast(err.message, 'error'); }
  };
}

async function persistPlanOrder(ids) {
  const byId = new Map(state.plans.map((p) => [String(p.id), p]));
  state.plans = ids.map((id) => byId.get(id)).filter(Boolean);
  try { await api('/admin/plans/reorder', { method: 'POST', body: { ids: ids.map(Number) } }); toast('Order saved.'); }
  catch (e) { toast(e.message, 'error'); }
}

async function deletePlan(p) {
  const ok = await confirmDialog({ title: `Delete ${p.name}?`, body: 'It will disappear from your homepage. This can’t be undone.', confirmText: 'Delete', danger: true });
  if (!ok) return;
  try {
    await api('/admin/plans/' + p.id, { method: 'DELETE' });
    state.plans = state.plans.filter((x) => x.id !== p.id);
    toast('Removed.');
    renderPricing();
  } catch (e) { toast(e.message, 'error'); }
}

function openPlanEditor(existing, preset = {}) {
  const isNew = !existing;
  const t = existing
    ? { ...clone(existing), price_monthly: numStr(existing.price_monthly), price_yearly: numStr(existing.price_yearly), old_price_monthly: numStr(existing.old_price_monthly), old_price_yearly: numStr(existing.old_price_yearly), features: (existing.features || []).slice() }
    : { name: '', description: '', price_monthly: '', price_yearly: '', old_price_monthly: '', old_price_yearly: '', price_label: '', features: [], button_text: '', color: preset.offer ? '#FFF1D6' : '#E4E1F8', is_offer: !!preset.offer, badge: '', featured: false, visible: true };
  const COLORS = ['#E4E1F8', '#EDF8E5', '#FBE4EE', '#E5F1FC', '#FFF1D6', '#FFE3D6'];
  const mode = { yearly: false };
  const noun = () => (t.is_offer ? 'offer' : 'plan');

  const panel = openPanel({
    kind: 'dialog', width: '940px',
    title: isNew ? (t.is_offer ? 'Add an offer' : 'Add a plan') : 'Edit ' + noun(),
    body: `<div class="editor">
      <div class="form" style="gap:16px">
        <label class="switch"><input type="checkbox" id="pl-offer"><i></i><span>This is an offer ✦ <span class="muted" style="font-weight:500">(the card shines on your site)</span></span></label>
        <div class="two">
          <div class="field"><label for="pl-name">Name</label><input class="input" id="pl-name" maxlength="60" autocomplete="off" placeholder="e.g. Starter, or Diwali offer"></div>
          <div class="field"><label for="pl-badge">Badge on top <span class="muted" style="font-weight:500">(optional)</span></label><input class="input" id="pl-badge" maxlength="40" autocomplete="off" placeholder="e.g. Most popular"></div>
        </div>
        <div class="field"><label for="pl-desc">Description</label><textarea class="textarea" id="pl-desc" maxlength="200" rows="2" placeholder="One line about who this is for"></textarea><span class="hint" id="pl-desc-n"></span></div>

        <div class="two">
          <div class="field"><label for="pl-pm">Monthly price</label><div class="prefix-wrap"><b>₹</b><input class="input" id="pl-pm" inputmode="numeric" autocomplete="off" placeholder="e.g. 50000"></div></div>
          <div class="field"><label for="pl-py">Yearly price <span class="muted" style="font-weight:500">(total for the year)</span></label><div class="prefix-wrap"><b>₹</b><input class="input" id="pl-py" inputmode="numeric" autocomplete="off" placeholder="e.g. 480000"></div></div>
        </div>
        <span class="hint" id="pl-calc"></span>
        <div class="two" id="pl-old-row">
          <div class="field"><label for="pl-om">Original monthly price <span class="muted" style="font-weight:500">(crossed out)</span></label><div class="prefix-wrap"><b>₹</b><input class="input" id="pl-om" inputmode="numeric" autocomplete="off" placeholder="price before the offer"></div></div>
          <div class="field"><label for="pl-oy">Original yearly price <span class="muted" style="font-weight:500">(crossed out)</span></label><div class="prefix-wrap"><b>₹</b><input class="input" id="pl-oy" inputmode="numeric" autocomplete="off" placeholder="price before the offer"></div></div>
        </div>
        <div class="field" id="pl-label-row"><label for="pl-label">Text instead of a price <span class="muted" style="font-weight:500">(used when both prices are empty)</span></label><input class="input" id="pl-label" maxlength="30" autocomplete="off" placeholder="Custom"></div>

        <div class="field"><label for="pl-feat">What’s included <span class="muted" style="font-weight:500">(one per line)</span></label><textarea class="textarea" id="pl-feat" rows="5" placeholder="1 active project&#10;2 revision rounds&#10;Figma source files"></textarea></div>
        <div class="two">
          <div class="field"><label for="pl-btn">Button text <span class="muted" style="font-weight:500">(optional)</span></label><input class="input" id="pl-btn" maxlength="30" autocomplete="off" placeholder="Choose Starter"></div>
          <div class="field"><span class="lbl">Card color</span><div class="swatches" id="pl-colors" role="radiogroup" aria-label="Card color"></div></div>
        </div>
        <label class="switch" id="pl-feat-sw"><input type="checkbox" id="pl-featured"><i></i><span>Highlight this card <span class="muted" style="font-weight:500">(bigger, black button)</span></span></label>
        <label class="switch"><input type="checkbox" id="pl-vis"><i></i><span>Show on my site</span></label>
      </div>
      <aside class="preview"><div class="row" style="justify-content:space-between"><div class="pv-label">Card on your site</div>
        <div class="seg" role="group" aria-label="Preview billing"><button type="button" data-mode="m" class="on">Monthly</button><button type="button" data-mode="y">Yearly</button></div></div>
        <div id="pl-card"></div></aside>
    </div>`,
    footer: `<button class="btn" data-cancel>Cancel</button><button class="btn primary" data-save>${isNew ? 'Add' : 'Save changes'}</button>`
  });
  const q1 = panel.$;

  const bind = (sel, key, { digits = false } = {}) => {
    const el = q1(sel);
    el.value = t[key] || '';
    el.addEventListener('input', () => {
      if (digits) { const d = el.value.replace(/\D/g, ''); if (d !== el.value) el.value = d; }
      t[key] = el.value; panel.dirty = true; el.classList.remove('err'); paint();
    });
  };
  bind('#pl-name', 'name'); bind('#pl-badge', 'badge'); bind('#pl-desc', 'description'); bind('#pl-label', 'price_label'); bind('#pl-btn', 'button_text');
  bind('#pl-pm', 'price_monthly', { digits: true }); bind('#pl-py', 'price_yearly', { digits: true });
  bind('#pl-om', 'old_price_monthly', { digits: true }); bind('#pl-oy', 'old_price_yearly', { digits: true });
  const feat = q1('#pl-feat');
  feat.value = t.features.join('\n');
  feat.addEventListener('input', () => { t.features = feat.value.split('\n').map((x) => x.trim()).filter(Boolean); panel.dirty = true; paint(); });
  const flag = (sel, key) => { const el = q1(sel); el.checked = !!t[key]; el.addEventListener('change', () => { t[key] = el.checked; panel.dirty = true; paint(); }); };
  flag('#pl-offer', 'is_offer'); flag('#pl-featured', 'featured'); flag('#pl-vis', 'visible');

  function paintColors() {
    const custom = !COLORS.includes(t.color.toUpperCase());
    q1('#pl-colors').innerHTML = COLORS.map((c) => `<button type="button" class="swatch ${c.toUpperCase() === t.color.toUpperCase() ? 'on' : ''}" style="background:${c}" data-c="${c}" role="radio" aria-checked="${c.toUpperCase() === t.color.toUpperCase()}" aria-label="Color ${c}"></button>`).join('') +
      `<input type="color" id="pl-custom" value="${esc(t.color)}" aria-label="Pick a custom color" title="Custom color" ${custom ? 'style="outline:2px solid var(--violet);outline-offset:3px"' : ''}>`;
  }
  q1('#pl-colors').addEventListener('click', (e) => { const b = e.target.closest('.swatch'); if (b) { t.color = b.dataset.c; panel.dirty = true; paintColors(); paint(); } });
  q1('#pl-colors').addEventListener('input', (e) => {
    if (e.target.id === 'pl-custom') { t.color = e.target.value; panel.dirty = true; paint(); q1('#pl-colors').querySelectorAll('.swatch').forEach((s) => s.classList.remove('on')); }
  });
  panel.el.addEventListener('click', (e) => {
    const b = e.target.closest('.seg button');
    if (!b) return;
    mode.yearly = b.dataset.mode === 'y';
    panel.$$('.seg button').forEach((x) => x.classList.toggle('on', x === b));
    paint();
  });

  const current = () => ({
    ...t, features: t.features,
    price_monthly: toNum(t.price_monthly), price_yearly: toNum(t.price_yearly),
    old_price_monthly: t.is_offer ? toNum(t.old_price_monthly) : null, old_price_yearly: t.is_offer ? toNum(t.old_price_yearly) : null
  });
  function paint() {
    const p = current();
    q1('#pl-old-row').hidden = !t.is_offer;
    q1('#pl-feat-sw').hidden = t.is_offer;
    q1('#pl-label-row').hidden = p.price_monthly != null || p.price_yearly != null;
    q1('#pl-badge').placeholder = t.is_offer ? 'e.g. Diwali offer · 20% off' : 'e.g. Most popular';
    q1('#pl-desc-n').textContent = `${t.description.length}/200`;
    let calc = 'Leave a price empty if you don’t sell it that way. Empty on both shows the text below instead.';
    if (p.price_monthly && p.price_yearly) {
      const full = p.price_monthly * 12, pct = Math.round((1 - p.price_yearly / full) * 100);
      calc = pct > 0
        ? `Yearly works out to ${inr(Math.round(p.price_yearly / 12))}/month, which is ${pct}% less than paying monthly (${inr(full)} a year).`
        : `Yearly works out to ${inr(Math.round(p.price_yearly / 12))}/month. That’s not cheaper than paying monthly (${inr(full)} a year).`;
    }
    q1('#pl-calc').textContent = calc;
    q1('#pl-card').innerHTML = planPreviewHtml(p, mode.yearly);
    q1('[data-save]').textContent = isNew ? 'Add' : 'Save changes';
  }

  async function save() {
    if (!t.name.trim()) { const n = q1('#pl-name'); n.classList.add('err'); n.focus(); toast('Add a name first.', 'error'); return; }
    const btn = q1('[data-save]');
    btn.classList.add('busy'); btn.textContent = 'Saving…';
    try {
      const body = { ...t, price_monthly: t.price_monthly || null, price_yearly: t.price_yearly || null, old_price_monthly: t.old_price_monthly || null, old_price_yearly: t.old_price_yearly || null };
      const saved = isNew ? await api('/admin/plans', { method: 'POST', body }) : await api('/admin/plans/' + t.id, { method: 'PUT', body });
      state.plans = state.plans || [];
      if (isNew) state.plans.push(saved); else state.plans = state.plans.map((x) => (x.id === saved.id ? saved : x));
      panel.dirty = false;
      await panel.close(true);
      toast(isNew ? 'Added to your pricing.' : 'Changes saved.');
      if (currentRoute() === 'pricing') renderPricing();
    } catch (err) { btn.classList.remove('busy'); paint(); toast(err.message, 'error'); }
  }
  q1('[data-save]').addEventListener('click', save);
  q1('[data-cancel]').addEventListener('click', () => panel.close());
  panel.el.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
  paintColors(); paint();
  q1('#pl-name').focus();
}

async function viewFaq() {

function faqRowHtml(f) {
  return `<article class="tcard" data-id="${f.id}" draggable="true" style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px">
    <span class="grip" aria-hidden="true" style="margin-top:3px">${icon('grip')}</span>
    <div style="flex:1;min-width:0">
      <h3 style="margin:0 0 4px">${esc(f.question)}</h3>

function renderFaq() {
  const view = $('#view');
  const head = pageHead('Common questions', 'The FAQ accordion shown under Pricing on your homepage. Drag to reorder.',
    `<button class="btn primary cta-glow shine-btn" data-act="add">${icon('plus')}Add question</button>`);
  if (!state.faqs.length) {
    view.innerHTML = head + `<div class="empty"><div class="art">${icon('help')}</div><h3>No questions yet</h3>
      <p>Add the questions people ask before working with you. Once you add one, the FAQ section appears on your homepage.</p>
      <button class="btn primary" data-act="add">${icon('plus')}Add a question</button></div>`;
  } else {
    view.innerHTML = head + `<div class="tgrid" id="faqGrid" style="grid-template-columns:1fr">${state.faqs.map(faqRowHtml).join('')}</div>`;
    enableSort($('#faqGrid'), { axis: 'y', onDone: persistFaqOrder });
  }
  view.onclick = (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const card = b.closest('[data-id]');

async function persistFaqOrder(ids) {
  const byId = new Map(state.faqs.map((f) => [String(f.id), f]));
  state.faqs = ids.map((id) => byId.get(id)).filter(Boolean);
  try { await api('/admin/faqs/reorder', { method: 'POST', body: { ids: ids.map(Number) } }); toast('Order saved.'); }

}

async function deleteFaq(f) {
  const ok = await confirmDialog({ title: 'Remove this question?', body: 'It’ll disappear from your homepage. This can’t be undone.', confirmText: 'Remove question', danger: true });

  try {
    await api('/admin/faqs/' + f.id, { method: 'DELETE' });

async function viewSocial() {

function socialRowHtml(s) {

    <span class="sicon">${platformIcon(s.platform)}</span>
    <select class="select s-sel" data-k="platform" aria-label="Platform">${opts}</select>
    <div class="url-wrap">
      <input class="input" data-k="url" value="${esc(isEmail ? s.url.replace(/^mailto:/i, '') : s.url)}" placeholder="${isEmail ? 'name@email.com' : 'https://…'}" aria-label="Link address" autocomplete="off" inputmode="${isEmail ? 'email' : 'url'}" autocapitalize="off">

  </div>`;
}

function renderSocial(reset) {
  if (reset) socialDraft = clone(state.settings.socials || []).map((s) => ({ ...s, _id: nextUid() }));
  const used = new Set(socialDraft.map((s) => s.platform));
  const chips = Object.entries(state.platforms).filter(([k]) => k === 'other' || !used.has(k))
    .map(([k, v]) => `<button type="button" data-add="${k}">${platformIcon(k, 'sm')}${esc(v.label)}</button>`).join('');
  $('#view').innerHTML =
    pageHead('Social links', 'Add the places people can find you. Toggle a link off to hide it without deleting it.') +
    `<div id="slist">${socialDraft.length ? socialDraft.map(socialRowHtml).join('') : `<div class="empty" style="padding:34px"><h3>No links yet</h3><p style="margin-bottom:0">Pick a platform below to add your first one.</p></div>`}</div>
     <section class="card" style="margin-top:18px"><div class="card-h"><h2>Add a link</h2></div><div class="card-b"><div class="addchips">${chips}</div></div></section>
     <section class="card" style="margin-top:18px"><div class="card-h"><h2>Where they show up</h2></div><div class="card-b"><div class="where">
       <div class="box"><b>Site header</b><p>The first three visible links.</p><div class="icons" id="pvHeader"></div></div>
       <div class="box"><b>Contact section</b><p>Every visible link.</p><div class="icons" id="pvContact"></div></div>
     </div></div></section>`;
  paintSocialPreview();

  const list = $('#slist');
  const markDirty = () => setDirty(true, { save: saveSocial, discard: () => { setDirty(false); renderSocial(true); } });
  const find = (el) => socialDraft.find((s) => s._id === el.closest('[data-id]').dataset.id);

  list.addEventListener('input', (e) => {
    const k = e.target.dataset.k;
    if (!k || k === 'platform' || k === 'enabled') return;
    find(e.target)[k] = e.target.value;
    markDirty(); paintSocialPreview();
  });
  list.addEventListener('change', (e) => {
    const k = e.target.dataset.k;
    const s = k && find(e.target);
    if (!s) return;
    if (k === 'platform') { s.platform = e.target.value; markDirty(); renderSocial(false); setDirty(true, { save: saveSocial, discard: () => { setDirty(false); renderSocial(true); } }); }
    if (k === 'enabled') { s.enabled = e.target.checked; markDirty(); paintSocialPreview(); }
  });
  list.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const s = find(b);
    const i = socialDraft.indexOf(s);
    if (b.dataset.act === 'rm') socialDraft = socialDraft.filter((x) => x !== s);
    else if (b.dataset.act === 'up' && i > 0) [socialDraft[i - 1], socialDraft[i]] = [socialDraft[i], socialDraft[i - 1]];
    else if (b.dataset.act === 'down' && i < socialDraft.length - 1) [socialDraft[i + 1], socialDraft[i]] = [socialDraft[i], socialDraft[i + 1]];
    else return;
    renderSocial(false); markDirty();
  });
  enableSort(list, { onDone: (ids) => { socialDraft = ids.map((id) => socialDraft.find((s) => s._id === id)).filter(Boolean); markDirty(); paintSocialPreview(); } });
  $$('[data-add]').forEach((b) => b.addEventListener('click', () => {
    socialDraft.push({ platform: b.dataset.add, label: '', url: '', enabled: true, _id: nextUid() });
    renderSocial(false); markDirty();
    const inputs = $$('#slist [data-k="url"]');
    inputs[inputs.length - 1].focus();
  }));
}

function paintSocialPreview() {
  const on = socialDraft.filter((s) => s.enabled && s.url.trim());
  const ico = (s) => `<span class="ico" title="${esc(state.platforms[s.platform] ? state.platforms[s.platform].label : '')}">${platformIcon(s.platform)}</span>`;
  const none = '<span class="muted" style="font-size:12.5px">Nothing to show yet.</span>';
  $('#pvHeader').innerHTML = on.slice(0, 3).map(ico).join('') || none;
  $('#pvContact').innerHTML = on.map(ico).join('') || none;
}

async function saveSocial() {
  const btn = $('#saveBtn');
  btn.classList.add('busy');
  try {
    const socials = socialDraft.filter((s) => s.url.trim()).map(({ _id, ...rest }) => rest);
    state.settings = await api('/admin/settings', { method: 'PUT', body: { site: state.settings.site, socials } });
    setDirty(false);
    renderSocial(true);
    toast('Social links saved.');
  } catch (e) { toast(e.message, 'error'); }
  btn.classList.remove('busy');
}

/* ==========================================================================
   Site content
   ========================================================================== */
const SITE_FIELDS = [
  { key: 'brand_name', label: 'Brand name', hint: 'Shown in the header, the hero heading, the team section and the projects page.', max: 40 },
  { key: 'tagline', label: 'Hero paragraph', hint: 'The short paragraph under your main heading.', max: 300, area: true },
  { key: 'site_url_label', label: 'Address shown in the hero browser bar', hint: 'Just text for the little browser window illustration.', max: 60 },
  { key: 'contact_email', label: 'Contact email', hint: 'Shown at the bottom of your contact section.', max: 120 },
  { key: 'location', label: 'Location', hint: 'Shown next to your email, for example “India”.', max: 60 },
  { key: 'availability_message', label: 'Availability message', hint: 'Pops up when a visitor clicks the rotating “available” badge.', max: 160 },
  { key: 'about_heading', label: 'About heading', hint: 'The bold heading in the “About us” section.', max: 140 },
  { key: 'about_description', label: 'About paragraph', hint: 'The paragraph under the About heading.', max: 400, area: true }
];
let siteDraft = {};

async function viewSite() {
  if (!state.settings) state.settings = await api('/admin/settings');
  renderSite();
}
function renderSite() {
  siteDraft = clone(state.settings.site);
  $('#view').innerHTML = pageHead('Site content', 'The main text on your homepage. Changes go live as soon as you save.') +
    `<section class="card formcard"><div class="card-b">` +
    SITE_FIELDS.map((f) => `<div class="field"><label for="sf-${f.key}">${f.label}</label>` +
      (f.area ? `<textarea class="textarea" id="sf-${f.key}" rows="3" maxlength="${f.max}"></textarea>` : `<input class="input" id="sf-${f.key}" maxlength="${f.max}" autocomplete="off">`) +
      `<span class="hint">${f.hint}</span></div>`).join('') +
    `</div></section>`;
  SITE_FIELDS.forEach((f) => {
    const el = $('#sf-' + f.key);
    el.value = siteDraft[f.key] || '';
    el.addEventListener('input', () => {
      siteDraft[f.key] = el.value; el.classList.remove('err');
      setDirty(true, { save: saveSite, discard: () => { setDirty(false); renderSite(); } });
    });
  });
}
async function saveSite() {
  if (!siteDraft.brand_name.trim()) { const el = $('#sf-brand_name'); el.classList.add('err'); el.focus(); toast('Brand name can’t be empty.', 'error'); return; }
  const btn = $('#saveBtn');
  btn.classList.add('busy');
  try {
    state.settings = await api('/admin/settings', { method: 'PUT', body: { site: siteDraft, socials: state.settings.socials } });
    setDirty(false);
    applyBrand();
    renderSite();
    toast('Site content saved.');
  } catch (e) { toast(e.message, 'error'); }
  btn.classList.remove('busy');
}

/* ==========================================================================
   Messages
   ========================================================================== */
async function viewMessages() {
  state.messages = await api('/admin/messages');
  renderMessages();
}
function renderMessages() {
  const list = state.messages;
  state.unread = list.filter((m) => !m.is_read).length;
  renderNav('messages');
  const view = $('#view');
  const head = pageHead('Messages', 'Everything visitors send through your contact form lands here.',
    state.unread ? `<button class="btn" id="readAll">${icon('check', 'sm')}Mark all as read</button>` : '');
  if (!list.length) {
    view.innerHTML = head + `<div class="empty"><div class="art">${icon('inbox')}</div><h3>No messages yet</h3><p>When someone fills in the contact form on your site, their message shows up here.</p></div>`;
    return;
  }
  view.innerHTML = head + list.map((m) => {
    const subject = encodeURIComponent(`Re: your message to ${brandName()}`);
    return `<article class="msg ${m.is_read ? '' : 'unread'}" data-id="${m.id}">
      <button class="msg-h" aria-expanded="false">
        <span class="avatar">${esc(initial(m.name))}</span>
        <span class="t"><b>${esc(m.name)}${m.is_read ? '' : '<span class="dot" title="Unread"></span>'}</b><span>${esc(m.message)}</span></span>
        <time datetime="${esc(m.created_at)}">${timeAgo(m.created_at)}</time>
      </button>
      <div class="msg-b" hidden>
        <p class="muted" style="margin-top:12px">${esc(m.email)}</p>
        <div class="text">${esc(m.message)}</div>
        <div class="row">
          <a class="btn primary sm" href="mailto:${esc(m.email)}?subject=${subject}">${icon('mail', 'sm')}Reply by email</a>
          <button class="btn sm" data-act="read">${m.is_read ? 'Mark as unread' : 'Mark as read'}</button>
          <span class="spacer"></span>
          <button class="btn sm icon danger" data-act="delete" aria-label="Delete message" title="Delete">${icon('trash', 'sm')}</button>
        </div>
      </div>
    </article>`;
  }).join('');

  const ra = $('#readAll');
  if (ra) ra.onclick = async () => {
    try { await api('/admin/messages/read-all', { method: 'POST' }); state.messages.forEach((m) => { m.is_read = true; }); renderMessages(); toast('All messages marked as read.'); }
    catch (e) { toast(e.message, 'error'); }
  };
  view.onclick = async (e) => {
    const card = e.target.closest('.msg');
    if (!card) return;
    const m = state.messages.find((x) => String(x.id) === card.dataset.id);
    const act = e.target.closest('[data-act]');
    try {
      if (e.target.closest('.msg-h')) {
        const body = $('.msg-b', card), h = $('.msg-h', card);
        const open = body.hidden;
        body.hidden = !open; h.setAttribute('aria-expanded', String(open));
        if (open && !m.is_read) {
          await api('/admin/messages/' + m.id, { method: 'PATCH', body: { is_read: true } });
          m.is_read = true; card.classList.remove('unread'); const d = $('.dot', card); if (d) d.remove();
          state.unread = state.messages.filter((x) => !x.is_read).length; renderNav('messages');
        }
      } else if (act && act.dataset.act === 'read') {
        await api('/admin/messages/' + m.id, { method: 'PATCH', body: { is_read: !m.is_read } });
        m.is_read = !m.is_read; renderMessages();
      } else if (act && act.dataset.act === 'delete') {
        const ok = await confirmDialog({ title: 'Delete this message?', body: `The message from ${m.name} will be permanently deleted.`, confirmText: 'Delete message', danger: true });
        if (!ok) return;
        await api('/admin/messages/' + m.id, { method: 'DELETE' });
        state.messages = state.messages.filter((x) => x.id !== m.id); renderMessages(); toast('Message deleted.');
      }
    } catch (err) { toast(err.message, 'error'); }
  };
}

/* ==========================================================================
   Admins and access
   ========================================================================== */
async function viewAdmins() {
  state.admins = await api('/admin/admins');
  renderAdmins();
}
function renderAdmins() {
  const owner = state.me.isOwner;
  const view = $('#view');
  view.innerHTML = pageHead('Admins and access', 'Everyone listed here can sign in with their Google account and manage the site.') +
    `<div class="note">${icon('info')}<div>The admin panel lives at <code class="url">${esc(location.origin)}/admin</code>. It isn’t linked from your public site.${owner ? '' : ` Only the owner (${esc(state.me.ownerEmail)}) can add or remove admins.`}</div></div>` +
    (owner ? `<section class="card" style="margin-bottom:18px"><div class="card-h"><h2>Add an admin</h2></div><div class="card-b">
       <div class="row"><input class="input" id="newAdmin" type="email" placeholder="name@gmail.com" aria-label="Google email address" autocomplete="off"><button class="btn primary" id="addAdmin">${icon('plus')}Add admin</button></div>
       <p class="hint" style="margin-top:8px">Use the exact Google account they’ll sign in with.</p></div></section>` : '') +
    state.admins.map((a) => `<div class="arow" data-email="${esc(a.email)}">
      <span class="avatar">${a.picture ? `<img src="${esc(a.picture)}" alt="" referrerpolicy="no-referrer" width="36" height="36" style="width:100%;height:100%;object-fit:cover">` : esc(initial(a.name || a.email))}</span>
      <div class="t"><b>${esc(a.name || a.email)}${a.isOwner ? '<span class="pill">Owner</span>' : ''}${a.email === state.me.email ? '<span class="pill line">You</span>' : ''}</b>
        <span>${a.name ? esc(a.email) + ' — ' : ''}${a.last_login ? 'last signed in ' + timeAgo(a.last_login) : 'hasn’t signed in yet'}${a.added_by && a.added_by !== 'system' ? `, added by ${esc(a.added_by)}` : ''}</span></div>
      ${owner && !a.isOwner ? `<button class="btn sm danger" data-act="remove">${icon('trash', 'sm')}Remove</button>` : ''}
    </div>`).join('');

  const add = async () => {
    const inp = $('#newAdmin');
    const email = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { inp.classList.add('err'); inp.focus(); toast('Enter a valid Google email address.', 'error'); return; }
    try { await api('/admin/admins', { method: 'POST', body: { email } }); toast(`${email} can now sign in.`); await viewAdmins(); }
    catch (e) { toast(e.message, 'error'); }
  };
  if (owner) {
    $('#addAdmin').onclick = add;
    $('#newAdmin').addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    $('#newAdmin').addEventListener('input', (e) => e.target.classList.remove('err'));
  }
  view.onclick = async (e) => {
    const b = e.target.closest('[data-act="remove"]');
    if (!b) return;
    const email = b.closest('[data-email]').dataset.email;
    const ok = await confirmDialog({ title: 'Remove this admin?', body: `${email} will lose access right away and be signed out.`, confirmText: 'Remove admin', danger: true });
    if (!ok) return;
    try { await api('/admin/admins/' + encodeURIComponent(email), { method: 'DELETE' }); toast('Admin removed.'); await viewAdmins(); }
    catch (err) { toast(err.message, 'error'); }
  };
}

/* ==========================================================================
   Go
   ========================================================================== */
start();
})();
</script>
</body>
</html>
